name: Backfill historical releases
on:
  workflow_dispatch:
    inputs:
      write:
        description: Create missing v0 GitHub releases after auditing (never publishes to npm)
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: backfill-releases
  cancel-in-progress: false
jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - name: Audit historical artifacts
        if: '!inputs.write'
        run: node scripts/backfill-releases.mjs
      - name: Audit and create missing GitHub releases
        if: inputs.write
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/backfill-releases.mjs --write
